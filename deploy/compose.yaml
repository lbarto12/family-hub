# Production database for the backroom machine.
#
# Deployed to $APP_DIR/compose.yaml and driven by deploy/remote-deploy.sh, which
# derives the POSTGRES_* values below from DATABASE_URL in $APP_DIR/.env.
#
# Unlike the dev compose at the repo root this does not mount the drizzle
# migrations into docker-entrypoint-initdb.d — those run only on first init and
# would drift from the journal. Migrations are applied by scripts/migrate.ts on
# every deploy instead.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Bound to loopback: the app runs on the host, and nothing on the tailnet
    # has any business talking to postgres directly.
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      # postgres 18+ wants the mount at /var/lib/postgresql, not .../data — it
      # stores data in a major-version subdirectory so pg_upgrade --link works.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Bitwarden-compatible vault server. Deliberately NOT sharing the app's
  # postgres: SQLite on its own volume is what upstream recommends at this size,
  # and it keeps the vault's lifecycle independent of the app's database.
  #
  # The vault is end-to-end encrypted by the Bitwarden clients, so this server
  # only ever stores ciphertext. That property depends on people using the real
  # clients (iOS/Android/extension) rather than a web vault this box serves.
  vaultwarden:
    image: vaultwarden/server:1.37.2-alpine
    restart: unless-stopped
    # Loopback only, exactly like postgres: tailscale decides who reaches this.
    ports:
      - 127.0.0.1:${VAULTWARDEN_PORT:-8222}:80
    environment:
      # Used to build invite links and as the WebAuthn relying-party ID. It must
      # match the URL people actually visit, or 2FA and invites break.
      DOMAIN: ${VAULTWARDEN_DOMAIN:-https://primary.tail84c71b.ts.net:8443}
      # No open registration on an internet-facing vault. Family members are
      # invited, which still requires them to be confirmed.
      SIGNUPS_ALLOWED: 'false'
      INVITATIONS_ALLOWED: 'true'
      # Empty disables the admin panel outright, which is the right default
      # until a real token is wired through app.env.
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-}
    volumes:
      - vaultwarden:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/alive || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  pgdata:
  vaultwarden:
